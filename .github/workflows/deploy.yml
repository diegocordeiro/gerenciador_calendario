name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

# O HTML versionado (por etapa + versão final) já vem commitado na pasta build/,
# gerada localmente por `python manage.py render_static_site` (veja o Makefile).
# Este workflow apenas publica a pasta no GitHub Pages.

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      # Guardrail: o build/ é gerado localmente com os links prefixados pela base do
      # Pages (project pages → /<repo>/). Se alguém commitar um build gerado com a
      # raiz ("/static/...", como em 'make gerar'), o site sobe sem CSS/imagens.
      # Aqui a publicação falha antes de dar deploy num build quebrado.
      - name: Verificar base do build (project pages)
        run: |
          BASE="/${GITHUB_REPOSITORY#*/}/"
          if ! grep -qF "href=\"${BASE}static/css/main.css\"" build/index.html; then
            echo "::error::build/index.html não aponta para ${BASE}. Rode 'make publicar' e commite o build/ antes do push."
            exit 1
          fi
          if grep -rlE '(href|src)="/static/' build --include='*.html'; then
            echo "::error::build/ contém links a partir da raiz ('/static/...') que dão 404 em project pages. Rode 'make publicar'."
            exit 1
          fi

      - name: Publicar artefato (build/ commitado)
        uses: actions/upload-pages-artifact@v3
        with:
          path: build

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
